# VMTools Next — Nginx reverse proxy config
#
# ⚠️ 安全（审计 v1.2 P1-4）：后端 uvicorn 用 forwarded_allow_ips="*" 信任任何
#    来源的 X-Forwarded-For。因此 **app:8080 只能对本 nginx / 反代网段开放**：
#    docker-compose 里应写 "127.0.0.1:8080:8080"（而不是 "8080:8080"），
#    否则任何能直连 8080 的人都能伪造来源 IP，绕过登录/认证限流与 challenge 的
#    IP 绑定。若必须跨主机反代，请用防火墙限制来源，并同步收紧 uvicorn 的
#    forwarded_allow_ips（改为具体反代地址，而不是 "*"）。

upstream vmtools_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 时装资产上传上限 64MB（与后端 MAX_ASSET_BYTES 保持一致；nginx 默认只有 1MB）
    client_max_body_size 64m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # API proxy
    location /api/ {
        proxy_pass http://vmtools_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # WebSocket proxy (Socket.IO)
    location /socket.io/ {
        proxy_pass http://vmtools_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Static files (if served by Nginz)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        proxy_pass http://vmtools_backend;
        proxy_set_header Host $host;
    }

    # Health check endpoint (no auth)
    location /api/health {
        proxy_pass http://vmtools_backend;
        access_log off;
    }
}
