  #     - ./backend/deploy/nginx/vmtools-next.conf:/etc/nginx/conf.d/default.conf
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app

volumes:
  vmtools-data:
  vmtools-logs:
