<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#ECE9E0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- SEO：原来没有 description，搜索结果/分享卡片只能拿到空摘要 -->
    <meta name="description" content="VMTools —— Minecraft 服务器自动化工具台与 VMFashion 时装系统：网页衣柜、时装商店、时装包分发与 mod 同步。" />
    <title>VenusYu的第一个网站</title>
    <script>
      // 防闪白：在任何 CSS 加载前，按 localStorage / 系统偏好设置 data-theme
      // 关键点（修复历史 bug）：
      //  1) 用户手动选择（light/dark）优先于系统设置；
      //  2) 选择「跟随系统」（system）时必须按 prefers-color-scheme 解析为实际主题，
      //     绝不能把 data-theme 设成 'system'——CSS 无此选择器，会导致主题变量全部失效、
      //     html.dark 未挂 → 暗色用户刷新闪白、EP 组件样式错乱（"切换主题后 UI 失效"根因）；
      //  3) 同步挂 html.dark（Element Plus 暗色 css-vars 只认它）与 meta theme-color（地址栏）。
      (function () {
        try {
          var saved = localStorage.getItem('vmtools-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = 'light';
          if (saved === 'dark') theme = 'dark';
          else if (saved === 'light') theme = 'light';
          else theme = prefersDark ? 'dark' : 'light'; // 'system' / 无记录 / 异常值 → 跟随系统
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1A1916' : '#ECE9E0');
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) statusBar.setAttribute('content', theme === 'dark' ? 'black-translucent' : 'default');
        } catch (e) { /* 隐私模式等异常场景，默认亮色 */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      拉丁字体（DM Serif / DM Sans / Lora / JetBrains Mono）走 Google Fonts，中文已自托管
      （styles/fonts.css，/fonts/*.woff2）。原写法是同步 <link rel="stylesheet">：
      国内网络下 fonts.googleapis.com 不可达，浏览器要等连接超时才继续解析 → 首屏白屏。
      改成 media="print" + onload 切回 all：CSS 不阻塞渲染，字体到了再换（display=swap
      已经保证先用兜底字体显示）。noscript 场景保留同步加载。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      :root { color-scheme: light; }
      [data-theme="dark"], html.dark { color-scheme: dark; }
      body { margin: 0; background: #ECE9E0; }
      [data-theme="dark"] body, html.dark body { background: #1A1916; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
